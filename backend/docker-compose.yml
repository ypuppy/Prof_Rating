services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: profrating
      POSTGRES_PASSWORD: profrating
      POSTGRES_DB: profrating
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profrating -d profrating"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
